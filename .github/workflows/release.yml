name: Test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk libgcrypt20 xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run offline regression suite
        run: xvfb-run -a env ZGCAPRINT_TEST_UI=1 .venv/bin/python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync version-specific release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Versioned Markdown files are the source for published descriptions.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/published-tags.txt"
          for notes in release-notes/v*.md; do
            [ -f "$notes" ] || continue
            tag=$(basename "$notes" .md)
            if grep -Fxq -- "$tag" "$RUNNER_TEMP/published-tags.txt"; then
              current=$(gh release view "$tag" --json body --jq .body)
              wanted=$(cat "$notes")
              if [ "$current" != "$wanted" ]; then
                gh release edit "$tag" --notes-file "$notes"
                echo "Updated description for $tag"
              fi
            fi
          done
      - name: Build and publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0,"src"); from zgcaprint import __version__; print(__version__)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version $tag already has a release; no assets will be overwritten."
            exit 0
          fi
          notes="release-notes/$tag.md"
          if [ ! -s "$notes" ]; then
            echo "Missing version-specific release notes: $notes" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install .
          .venv/bin/python tools/build_release.py
          .venv/bin/python tools/build_deb.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          paths=sorted([*Path('dist').glob('*.deb'), *Path('dist').glob('*-source.zip')])
          Path('dist/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PY
          gh release create "$tag" dist/*.deb dist/*-source.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "ZGCA Linux 打印驱动 $tag" \
            --notes-file "$notes"
