name: Test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk libgcrypt20 xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run offline regression suite
        run: xvfb-run -a env ZGCAPRINT_TEST_UI=1 .venv/bin/python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0,"src"); from zgcaprint import __version__; print(__version__)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version $tag already has a release; no assets will be overwritten."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-description.md"
          if [ "$tag" = v1.0.3 ]; then
            cat > "$notes" <<'NOTES'
          本版改进安装与卸载体验，并优化客户端窗口布局。

          - 区分安装版和开发版入口，清理旧的同名源码入口；卸载后安装版停止接收新任务并在当前操作完成后退出。
          - 安装完成时明确显示客户端安装成功提示，保留用户配置和打印记录。
          - 放大 PDF 文件选择窗口，记住上次使用的目录；主窗口保持原大小，设置窗口适当加宽。
          - 任务表格根据字体调整列宽，完整显示“页数”等标题。
          - 精简记录清理选项及提示，后台清理逻辑保留。

          安装或升级前，请先从旧客户端右键菜单选择“退出”，然后执行：

          ```sh
          sudo apt install ./zgcaprint_1.0.3_all.deb
          ```

          [完整变更](https://github.com/He-JiYe/ZGAC-Printer-Linux/compare/v1.0.2...v1.0.3)
          NOTES
          else
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body > "$notes"
          fi
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install .
          .venv/bin/python tools/build_release.py
          .venv/bin/python tools/build_deb.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          paths=sorted([*Path('dist').glob('*.deb'), *Path('dist').glob('*-source.zip')])
          Path('dist/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PY
          gh release create "$tag" dist/*.deb dist/*-source.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "ZGCA Linux 打印驱动 $tag" \
            --notes-file "$notes"
