name: Test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk libgcrypt20 xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run offline regression suite
        run: xvfb-run -a env ZGCAPRINT_TEST_UI=1 .venv/bin/python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0,"src"); from zgcaprint import __version__; print(__version__)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version $tag already has a release; no assets will be overwritten."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install .
          .venv/bin/python tools/build_release.py
          .venv/bin/python tools/build_deb.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          paths=sorted([*Path('dist').glob('*.deb'), *Path('dist').glob('*-source.zip')])
          Path('dist/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PY
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          首个正式版本：ZGCA Linux 打印驱动。

          普通用户下载 .deb，在下载目录运行：
          `sudo apt install ./zgcaprint_1.0.0_all.deb`

          系统自动处理依赖。打开应用后连接校园内网，客户端自动下载并校验官方配置，再输入本人的打印账号。

          支持 PDF、浏览器打印、系统钥匙串、自动登录、自动启动与后台常驻。附带两页 A4 测试 PDF。
          已有用户验证正常出纸、无乱码；GitHub 回归测试使用合成数据，不访问校园服务。

          原厂安装包和个人认证配置不包含在公开发布物中。当前只适配已验证的 Mac 5.1.3.12 配置；官方包变化会停止首次导入，保留已有配置。
          学校服务使用 HTTP / FTP，仅在可信校园网络使用。请遵守学校认证、计费和刷卡规则。
          NOTES
          gh release create "$tag" dist/*.deb dist/*-source.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "ZGCA Linux 打印驱动 $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
